services:
  mysql:
    image: mysql:8.0
    container_name: media-comment-mysql
    environment:
      MYSQL_DATABASE: media_comment
      MYSQL_USER: comment
      MYSQL_PASSWORD: comment_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3306:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: