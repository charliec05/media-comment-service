server:
  port: 8080

spring:
  application:
    name: comment-service

  datasource:
    url: jdbc:mysql://localhost:3306/media_comment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: comment
    password: comment_pw
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
